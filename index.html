<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory</title>
</head>

<body>
  <main class="app">
    <section class="home" aria-labelledby="home-title">
      <div class="home__content">
        <div class="home__text">
          <p class="home__eyebrow">It’s play time.</p>
          <h1 class="home__title" id="home-title">Ready to play?</h1>
        </div>

        <button class="primary-button" type="button" aria-label="Spiel starten">
          <img src="/assets/icons/stadia-controller.png" alt="" width="44" height="32">
          <span>Play</span>
          <img src="/assets/icons/arrow-right.png" alt="" width="35" height="15">
        </button>
      </div>

      <img
        class="home__decoration"
        src="/assets/icons/stadia-controller-large.png"
        alt=""
        width="363"
        height="410"
        aria-hidden="true"
      >
    </section>
  </main>

  <script type="module" src="./src/main.ts"></script>

</html>
