<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/assets/icons/stadia-controller.png">
  <title>Memory</title>
</head>

<body data-screen="home" data-theme="code-vibes">
  <main class="app">
    <section class="home screen" data-screen-view="home" aria-labelledby="home-title">
      <div class="home__content">
        <div class="home__text">
          <p class="home__eyebrow">It’s play time.</p>
          <h1 class="home__title" id="home-title">Ready to play?</h1>
        </div>

        <button
          class="primary-button"
          type="button"
          data-action="open-settings"
          aria-label="Einstellungen öffnen"
        >
          <img
            class="primary-button__controller"
            src="/assets/icons/stadia-controller.png"
            alt=""
            width="44"
            height="32"
          >
          <span>Play</span>
          <span class="primary-button__arrow" aria-hidden="true">
            <img
              class="primary-button__arrow-image primary-button__arrow-image--default"
              src="/assets/icons/arrow-right.png"
              alt=""
              width="35"
              height="15"
            >
            <img
              class="primary-button__arrow-image primary-button__arrow-image--hover"
              src="/assets/icons/arrow-right-hover.png"
              alt=""
              width="40"
              height="30"
            >
          </span>
        </button>
      </div>

      <img
        class="home__decoration"
        src="/assets/icons/stadia-controller-large.png"
        alt=""
        width="363"
        height="410"
        aria-hidden="true"
      >
    </section>

    <section
      class="settings screen"
      data-screen-view="settings"
      aria-labelledby="settings-title"
    >
      <div class="settings__inner">
        <h1 class="settings__title" id="settings-title">Settings</h1>

        <form class="settings__form" id="settings-form">
          <div class="settings__choices">
            <fieldset class="settings-group settings-group--themes">
              <legend class="settings-group__title">
                <img src="/assets/icons/palette.png" alt="" width="27" height="27">
                <span>Game themes</span>
              </legend>

              <label class="settings-option">
                <input
                  type="radio"
                  name="theme"
                  value="code-vibes"
                  data-summary="Code vibes"
                  checked
                >
                <span>Code vibes theme</span>
              </label>

              <label class="settings-option">
                <input
                  type="radio"
                  name="theme"
                  value="gaming"
                  data-summary="Gaming"
                >
                <span>Gaming theme</span>
              </label>
            </fieldset>

            <fieldset class="settings-group">
              <legend class="settings-group__title">
                <img src="/assets/icons/chess-pawn.png" alt="" width="22" height="27">
                <span>Choose player</span>
              </legend>

              <label class="settings-option">
                <input type="radio" name="player" value="blue" data-summary="Blue">
                <span>Blue</span>
              </label>

              <label class="settings-option">
                <input type="radio" name="player" value="orange" data-summary="Orange">
                <span>Orange</span>
              </label>
            </fieldset>

            <fieldset class="settings-group">
              <legend class="settings-group__title">
                <img src="/assets/icons/board-size-icon.png" alt="" width="32" height="32">
                <span>Board size</span>
              </legend>

              <label class="settings-option">
                <input type="radio" name="boardSize" value="16" data-summary="16 cards">
                <span>16 cards</span>
              </label>

              <label class="settings-option">
                <input type="radio" name="boardSize" value="24" data-summary="24 cards">
                <span>24 cards</span>
              </label>

              <label class="settings-option">
                <input type="radio" name="boardSize" value="36" data-summary="36 cards">
                <span>36 cards</span>
              </label>
            </fieldset>
          </div>

          <div class="settings__visual">
            <div class="settings__preview" role="img" aria-label="Vorschau des gewählten Themes"></div>

            <div class="settings-summary" aria-live="polite">
              <span id="theme-summary">Code vibes</span>
              <span class="settings-summary__separator" aria-hidden="true"></span>
              <span id="player-summary">Player</span>
              <span class="settings-summary__separator" aria-hidden="true"></span>
              <span id="board-summary">Board size</span>

              <button
                class="settings-summary__button"
                type="button"
                data-action="start-game"
                disabled
              >
                <img
                  class="settings-summary__button-icon"
                  src="/assets/icons/play-button.png"
                  alt=""
                  width="20"
                  height="16"
                >
                <span>Start</span>
              </button>
            </div>
          </div>
        </form>
      </div>
    </section>

    <section
      class="game-screen screen"
      data-screen-view="game"
      aria-label="Memory-Spiel"
    >
      <header class="game-header">
        <div class="game-header__scores" aria-label="Punktestand">
          <span class="player-score player-score--blue">
            <img
              id="blue-player-icon"
              src="/assets/icons/game/player-blue.png"
              alt=""
              width="24"
              height="20"
            >
            <span>Blue</span>
            <strong id="blue-score">0</strong>
          </span>

          <span class="player-score player-score--orange">
            <img
              id="orange-player-icon"
              src="/assets/icons/game/player-orange.png"
              alt=""
              width="24"
              height="20"
            >
            <span>Orange</span>
            <strong id="orange-score">0</strong>
          </span>
        </div>

        <div class="game-header__current-player" id="current-player">
          <span>Current player:</span>
          <img
            id="current-player-icon"
            src="/assets/icons/game/player-blue.png"
            alt="Blue"
            width="24"
            height="20"
          >
        </div>

        <button class="game-header__exit" type="button" data-action="open-quit-dialog">
          <img src="/assets/icons/game/exit-game.png" alt="" width="30" height="30">
          <span>Exit game</span>
        </button>
      </header>

      <div class="memory-board" id="memory-board" aria-label="Memory-Karten"></div>
    </section>

    <section
      class="game-over-screen screen"
      data-screen-view="game-over"
      aria-label="Game over"
    >
      <div class="game-over-screen__content">
        <img
          class="game-over-screen__title"
          src="/assets/results/game-over.png"
          alt="Game over"
          width="998"
          height="138"
        >
        <h1 class="game-over-screen__gaming-title">GAME OVER</h1>

        <div class="final-score">
          <p class="final-score__title">Final score</p>
          <div class="final-score__values" aria-label="Endstand">
            <span class="player-score player-score--blue">
              <img src="/assets/icons/game/player-blue.png" alt="" width="24" height="20">
              <span>Blue</span>
              <strong id="final-blue-score">0</strong>
            </span>

            <span class="player-score player-score--orange">
              <img src="/assets/icons/game/player-orange.png" alt="" width="24" height="20">
              <span>Orange</span>
              <strong id="final-orange-score">0</strong>
            </span>
          </div>
        </div>
      </div>
    </section>

    <section
      class="result-screen screen"
      data-screen-view="result"
      aria-labelledby="result-title"
    >
      <img
        class="result-screen__confetti"
        src="/assets/results/confetti.png"
        alt=""
        width="1234"
        height="327"
        aria-hidden="true"
      >

      <div class="result-screen__content">
        <p class="result-screen__eyebrow" id="result-eyebrow">The winner is</p>
        <h1 class="result-screen__title" id="result-title">BLUE PLAYER</h1>
        <img
          class="result-screen__icon"
          id="result-icon"
          src="/assets/results/pawn-blue.png"
          alt="Blue player"
          width="200"
          height="250"
        >
        <button class="result-screen__button" type="button" data-action="back-to-settings">
          Back to start
        </button>
      </div>
    </section>
  </main>

  <dialog class="quit-dialog" id="quit-dialog" aria-labelledby="quit-dialog-title">
    <h2 class="quit-dialog__title" id="quit-dialog-title">
      Are you sure you want to quit<br>
      the game?
    </h2>

    <div class="quit-dialog__actions">
      <button class="quit-dialog__button" type="button" data-action="close-quit-dialog">
        Back to game
      </button>
      <button
        class="quit-dialog__button quit-dialog__button--outlined"
        type="button"
        data-action="confirm-game-exit"
      >
        Exit game
      </button>
    </div>
  </dialog>

  <script type="module" src="./src/main.ts"></script>
</body>

</html>
